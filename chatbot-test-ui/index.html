<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AskHub AI Chat Test</title>
    <meta name="description" content="AskHub AI 서버 채팅 테스트 인터페이스" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles.css?v=2" />
  </head>
  <body>
    <div class="app-shell">
      <!-- ═══ Sidebar ═══ -->
      <aside class="sidebar" aria-label="내비게이션">
        <div class="sidebar-top">
          <div class="sidebar-brand">
            <span class="brand-mark" aria-hidden="true">AH</span>
            <span class="brand-name">AskHub AI</span>
          </div>

          <button id="newChatBtn" class="new-chat-btn" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            새 채팅
          </button>
        </div>

        <div class="sidebar-sessions">
          <div class="sidebar-section-header">
            <span class="sidebar-section-title">채팅 내역</span>
            <button id="refreshSessionsBtn" class="sidebar-icon-btn" type="button" aria-label="새로고침" title="세션 새로고침">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
            </button>
          </div>
          <nav id="sessionList" class="session-list" aria-label="채팅 목록"></nav>
        </div>

        <div class="sidebar-bottom">
          <div class="sidebar-settings">
            <div class="setting-row">
              <label class="setting-label" for="userIdInput">User</label>
              <input id="userIdInput" type="number" value="1" min="1" inputmode="numeric" class="setting-input" />
            </div>
            <div class="setting-row">
              <label class="setting-label" for="teamIdInput">Team</label>
              <input id="teamIdInput" type="number" value="10" min="1" inputmode="numeric" class="setting-input" />
            </div>
          </div>

          <div class="sidebar-actions">
            <button id="viewSourcesBtn" class="sidebar-action-btn" type="button" title="소스 관리">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              <span>소스 관리</span>
            </button>
            <button id="healthCheckBtn" class="sidebar-action-btn" type="button" title="연결 확인">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
              <span>연결 확인</span>
            </button>
          </div>
        </div>
      </aside>

      <!-- ═══ Sources Panel ═══ -->
      <aside class="sources-panel" id="sourcesPanel" hidden>
        <header class="sources-header">
          <h2 class="sources-title">출처</h2>
          <div class="sources-header-actions">
            <button id="refreshSourcesBtn" class="icon-button" type="button" aria-label="새로고침">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
            </button>
            <button id="closeSourcesBtn" class="icon-button" type="button" aria-label="닫기">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </header>

        <div class="sources-body">
          <div class="add-source-wrapper">
            <div class="add-source-buttons">
              <button id="sourceUploadBtn" class="add-source-btn" type="button">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
                파일 업로드
              </button>
              <button id="repoSourceToggle" class="add-source-btn" type="button">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
                GitHub 레포
              </button>
            </div>
            <input
              id="sourceFileInput"
              type="file"
              class="file-input"
              hidden
              accept=".pdf,.doc,.docx,.ppt,.pptx,.txt,.md,.csv,.json,.xml,text/*,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.presentationml.presentation"
            />
            <form id="repoSourceForm" class="repo-source-form" hidden>
              <div class="repo-form-field">
                <label class="repo-form-label" for="repoUrlInput">Repository URL</label>
                <input id="repoUrlInput" type="url" class="repo-form-input" placeholder="https://github.com/owner/repo" required />
              </div>
              <div class="repo-form-field">
                <label class="repo-form-label" for="repoBranchInput">Branch (선택)</label>
                <input id="repoBranchInput" type="text" class="repo-form-input" placeholder="main" />
              </div>
              <button id="repoSourceSubmit" class="repo-submit-btn" type="submit">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                레포 소스 추가
              </button>
            </form>
          </div>

          <div id="sourceStatusBar" class="source-status-bar" hidden>
            <div class="source-status-spinner"></div>
            <span id="sourceStatusText">업로드 중...</span>
          </div>

          <section class="src-section">
            <div class="src-section-header">
              <h3 class="src-section-title">등록된 소스</h3>
              <span id="sourceCount" class="src-badge">0</span>
            </div>
            <div id="sourceList" class="src-cards" aria-live="polite"></div>
          </section>

          <section class="src-section">
            <div class="src-section-header">
              <h3 class="src-section-title">업로드 히스토리</h3>
            </div>
            <div id="filesList" class="src-cards" aria-live="polite"></div>
            <button id="loadMoreFilesBtn" class="load-more-btn" type="button" hidden>더 보기</button>
          </section>
        </div>
      </aside>

      <!-- ═══ Chat View ═══ -->
      <main class="chat-main" id="chatView">
        <header class="topbar">
          <span class="model-label">AskHub AI</span>
          <span id="sessionTitle" class="visually-hidden">새 채팅</span>
          <div class="topbar-actions">
            <div id="connectionStatus" class="status-pill" role="status">대기 중</div>
          </div>
        </header>

        <section id="messages" class="messages" aria-live="polite">
          <div class="empty-state">
            <h1>무엇을 도와드릴까요?</h1>
            <p>AskHub AI에 질문하거나, 파일을 첨부하여 분석해 보세요.</p>
          </div>
        </section>

        <section class="composer" aria-label="메시지 작성">
          <div class="composer-row">
            <div id="attachedFiles" class="attached-files" aria-live="polite"></div>
            <textarea
              id="messageInput"
              rows="1"
              placeholder="무엇이든 물어보세요"
              aria-label="질문 입력"
            ></textarea>
            <div class="composer-toolbar">
              <div class="composer-tools-left">
                <label class="attach-button" for="fileInput" aria-label="파일 첨부">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                </label>
                <input id="fileInput" class="file-input" type="file" multiple />
              </div>
              <div class="composer-tools-right">
                <button id="sendButton" class="send-button" type="button" aria-label="메시지 전송">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                </button>
              </div>
            </div>
          </div>
          <p class="composer-hint">AskHub AI는 실수를 할 수 있습니다. 중요한 정보는 재차 확인하세요.</p>
        </section>
      </main>
    </div>

    <!-- ═══ Document Viewer Modal ═══ -->
    <div id="docViewerModal" class="modal-overlay" hidden>
      <div class="modal-backdrop"></div>
      <div class="modal-container">
        <header class="modal-header">
          <span id="docViewerTitle" class="modal-title">문서 보기</span>
          <button id="docViewerClose" class="modal-close-btn" type="button" aria-label="닫기">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </header>
        <div id="docViewerBody" class="modal-body"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js" crossorigin="anonymous"></script>
    <script type="module" src="./js/main.js?v=2"></script>
  </body>
</html>
