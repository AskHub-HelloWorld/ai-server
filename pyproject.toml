[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "askhub-ai-server"
version = "0.1.0"
description = "AI chatbot and RAG orchestration service for AskHub."
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1,<25",
    "alembic>=1.14,<2",
    "boto3>=1.35,<2",
    "fastapi>=0.115,<1",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
    "python-pptx>=1.0,<2",
    "pymupdf>=1.24,<2",
    "python-docx>=1.1,<2",
]

[project.scripts]
askhub-worker = "askhub_ai_server.worker:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.0,<9",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
