services:
  api:
    build:
      context: .
      target: dev
    image: askhub-ai-server:dev
    command: uvicorn askhub_ai_server.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
      DB_SCHEMA: ${DB_SCHEMA:?DB_SCHEMA is required}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@${POSTGRES_HOST:?POSTGRES_HOST is required}:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SERVICE_AUTH_ENABLED: "true"
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?SERVICE_AUTH_SECRET is required}
    volumes:
      - .:/app
    networks:
      - askhub

  api-test:
    build:
      context: .
      target: dev
    image: askhub-ai-server:dev
    command: pytest
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
      APP_ENV: test
      DB_SCHEMA: ${TEST_DB_SCHEMA:?TEST_DB_SCHEMA is required}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@${POSTGRES_HOST:?POSTGRES_HOST is required}:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SERVICE_AUTH_ENABLED: "true"
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?SERVICE_AUTH_SECRET is required}
    volumes:
      - .:/app
    networks:
      - askhub

  migrate:
    build:
      context: .
      target: dev
    image: askhub-ai-server:dev
    command: alembic upgrade head
    profiles:
      - tools
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
      DB_SCHEMA: ${DB_SCHEMA:?DB_SCHEMA is required}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@${POSTGRES_HOST:?POSTGRES_HOST is required}:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SERVICE_AUTH_ENABLED: "true"
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?SERVICE_AUTH_SECRET is required}
    volumes:
      - .:/app
    networks:
      - askhub

networks:
  askhub:
    external: true
    name: ${ASKHUB_DOCKER_NETWORK:?ASKHUB_DOCKER_NETWORK is required}
