services:
  api:
    build:
      context: .
      target: dev
    image: askhub-ai-server:dev
    command: uvicorn askhub_ai_server.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql+psycopg://askhub:${DB_PASSWORD:-askhub}@postgres:5432/askhub
      DB_SCHEMA: ai
      UPLOAD_DIR: /app/uploads
    volumes:
      - .:/app
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      target: dev
    image: askhub-ai-server:dev
    command: python -m askhub_ai_server.worker
    profiles:
      - worker
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql+psycopg://askhub:${DB_PASSWORD:-askhub}@postgres:5432/askhub
      DB_SCHEMA: ai
      UPLOAD_DIR: /app/uploads
    volumes:
      - .:/app
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: askhub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-askhub}
      POSTGRES_DB: askhub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askhub -d askhub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  uploads:
